<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Discord 관리자 경력 - OrangeBlue</title>
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- 폰트: 제목은 세리프(Noto Serif KR), 본문은 Pretendard -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

<!-- 저장된 테마를 렌더링 전에 먼저 적용 (깜빡임 방지) -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('ob_theme');
      document.documentElement.setAttribute('data-theme', (saved === 'dark' || saved === 'light') ? saved : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<style>
    /* ===================== 컬러 토큰 (index.html과 동일) ===================== */
    :root,
    :root[data-theme="light"] {
      --bg: #faf9f6;
      --surface: #ffffff;
      --text: #1c1b19;
      --muted: #6f6b63;
      --border: #e4e1d9;
      --accent: #3d5a73;
      --accent-soft: rgba(61,90,115,0.08);
      --friendly: #4f7a5e;
      --friendly-soft: rgba(79,122,94,0.1);
      --danger: #b3432c;
      --shadow: 0 1px 2px rgba(28,27,25,0.04);
    }

    :root[data-theme="dark"] {
      --bg: #16150f;
      --surface: #1d1c17;
      --text: #ece8e0;
      --muted: #a49d8e;
      --border: #322f27;
      --accent: #8fb0cc;
      --accent-soft: rgba(143,176,204,0.1);
      --friendly: #8fb89c;
      --friendly-soft: rgba(143,184,156,0.1);
      --danger: #e0836a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height:1.65;
      overflow-x: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4 {
      font-family: 'Noto Serif KR', serif;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    a { color: inherit; }

    /* ===================== 사이드바 ===================== */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: var(--bg);
      border-right: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 40px 28px;
    }

    .profile-section { text-align: left; margin-bottom: 36px; }

    .profile-img {
      width: 76px; height: 76px; border-radius: 50%;
      object-fit: cover; margin-bottom: 18px; border: 1px solid var(--border);
    }

    .profile-name { font-size: 21px; color: var(--text); margin: 0 0 8px 0; font-weight: 700; }

    .profile-title {
      color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6;
      font-family: 'Pretendard Variable', Pretendard, sans-serif;
    }

    .nav-menu { flex: 1; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }

    .nav-item {
      display: flex; align-items: center; padding: 10px 10px; border-radius: 6px;
      color: var(--muted); text-decoration: none; font-size: 14px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .nav-item:hover { background: var(--accent-soft); color: var(--accent); }
    .nav-item.active { color: var(--text); font-weight: 600; }
    .nav-item.active i { color: var(--accent); }
    .nav-item i { margin-right: 10px; width: 16px; text-align: center; font-size: 13px; }

    .sidebar-socials {
      display: flex; gap: 6px; margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border);
    }

    .sidebar-socials a {
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; color: var(--muted); text-decoration: none !important;
      transition: color 0.15s ease, background 0.15s ease; font-size: 14px;
    }

    .sidebar-socials a:hover { color: var(--accent); background: var(--accent-soft); }

    /* ===================== 메인 컨텐츠 ===================== */
    .main-content { margin-left: 260px; min-height: 100vh; background: var(--bg); }

    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px; padding: 64px 48px 40px; max-width: 760px; margin: 0 auto;
    }

    .page-header-text h1 { font-size: 2.2rem; margin: 0 0 10px 0; color: var(--text); }
    .page-header-text p { color: var(--muted); font-size: 1rem; margin: 0; max-width: 46ch; }

    .page-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px; }

    .icon-btn {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); cursor: pointer; font-size: 14px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

    .theme-toggle .fa-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .fa-sun { display: inline; }
    :root[data-theme="dark"] .theme-toggle .fa-moon { display: none; }

    .content-section { padding: 0 48px 80px; max-width: 760px; margin: 0 auto; }

    .section-title { font-size: 1.3rem; color: var(--text); margin: 0 0 20px 0; }

    /* ===================== 통계 ===================== */
    .stats-section { margin-bottom: 56px; }

    .stats-row {
      display: flex;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat-block {
      flex: 1;
      padding: 24px 0;
      text-align: center;
      border-left: 1px solid var(--border);
    }
    .stat-block:first-child { border-left: none; }

    .stat-number {
      font-family: 'Noto Serif KR', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .stat-label { color: var(--muted); font-size: 13px; }

    /* ===================== 경력 표 ===================== */
    .experience-table-wrap { overflow-x: auto; }

    .experience-table {
      width: 100%;
      border-collapse: collapse;
    }

    .experience-table thead th {
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      padding: 0 12px 10px 0;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .experience-table tbody td {
      padding: 14px 12px 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .experience-table th:last-child,
    .experience-table td:last-child { padding-right: 0; }

    .col-server { font-weight: 700; color: var(--text); white-space: normal; }
    .col-category.community { color: var(--accent); font-weight: 600; }
    .col-category.friendly { color: var(--friendly); font-weight: 600; }
    .col-period { color: var(--muted); }
    .col-scale { font-weight: 700; color: var(--text); text-align: right; }
    .experience-table th.col-scale { text-align: right; }

    /* ===================== 반응형 ===================== */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.25s ease; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .page-header { flex-direction: column; padding: 76px 24px 24px; }
      .content-section { padding: 0 24px 60px; }
      .stats-row { flex-direction: column; }
      .stat-block { border-left: none; border-top: 1px solid var(--border); }
      .stat-block:first-child { border-top: none; }
      .experience-table thead th,
      .experience-table tbody td { font-size: 13px; }

      .mobile-menu-btn {
        position: fixed; top: 16px; left: 16px; z-index: 1001;
        width: 40px; height: 40px; background: var(--surface);
        border: 1px solid var(--border); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: var(--text); font-size: 16px; cursor: pointer;
      }
    }

    @media (min-width: 769px) { .mobile-menu-btn { display: none; } }
</style>
</head>
<body>
<!-- 모바일 메뉴 버튼 -->
<div class="mobile-menu-btn" onclick="toggleSidebar()">
<i class="fas fa-bars"></i>
</div>

<!-- 사이드바 -->
<aside class="sidebar" id="sidebar">
<div class="profile-section">
<img alt="프로필 사진" class="profile-img" src="images/profile.jpg"/>
<h1 class="profile-name">OrangeBlue</h1>
<p class="profile-title">더 궁금한게 있으면<br>디스코드 DM으로 오세요</p>
</div>
<nav class="nav-menu">
      <a href="index.html" class="nav-item">
        <i class="fa fa-user"></i>
        프로필
      </a>
      <a href="portfolio.html" class="nav-item active">
        <i class="fa fa-briefcase"></i>
        Discord 관리자 경력
      </a>
      <a href="misc.html" class="nav-item">
        <i class="fa fa-box"></i>
        잡동사니
      </a>
    </nav>
<div class="sidebar-socials">
<a href="https://github.com/OrangeBlue2336" title="GitHub" target="_blank"><i class="fab fa-github"></i></a>
<a href="https://tinyurl.com/2788ebfs" title="YouTube" target="_blank"><i class="fab fa-youtube"></i></a>
<a href="https://steamcommunity.com/profiles/76561199467922060" title="Steam" target="_blank"><i class="fab fa-steam"></i></a>
<a href="discord://-/users/1143199445035536404" title="Discord"><i class="fab fa-discord"></i></a>
</div>
</aside>

<!-- 메인 컨텐츠 -->
<main class="main-content">
  <!-- 상단 헤더 -->
  <div class="page-header">
    <div class="page-header-text">
      <h1>Discord 관리자 경력</h1>
      <p>다양한 서버에서의 Discord 관리 경험을 정리한 기록</p>
    </div>
    <div class="page-header-actions">
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="테마 전환" aria-label="다크/라이트 모드 전환">
        <i class="fas fa-moon"></i>
        <i class="fas fa-sun"></i>
      </button>
    </div>
  </div>

  <!-- 컨텐츠 섹션 -->
  <section class="content-section">
    <!-- 통계 섹션 -->
    <div class="stats-section">
      <h2 class="section-title">관리 경험 통계</h2>
      <div class="stats-row">
        <div class="stat-block">
          <div class="stat-number" id="server-count">-</div>
          <div class="stat-label">관리 서버 수</div>
        </div>
        <div class="stat-block">
          <div class="stat-number" id="member-count">-</div>
          <div class="stat-label">관리 인원 합계</div>
        </div>
        <div class="stat-block">
          <div class="stat-number" id="experience-years">-</div>
          <div class="stat-label">년간 경험</div>
        </div>
      </div>
    </div>

    <!-- 경력 목록 -->
    <h2 class="section-title">경력 상세</h2>
    <div class="experience-table-wrap">
      <table class="experience-table">
        <thead>
          <tr>
            <th class="col-server">서버</th>
            <th>구분</th>
            <th>기간</th>
            <th class="col-scale">규모</th>
          </tr>
        </thead>
        <tbody id="experience-list"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      const sidebar = document.getElementById('sidebar');
      const menuBtn = document.querySelector('.mobile-menu-btn');
      if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });

    // 다크/라이트 모드 토글 (index.html과 동일한 저장 키 공유)
    function toggleTheme() {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('ob_theme', next); } catch (e) {}
    }

    function animateNumber(element, target, suffix = '') {
      const startedAt = performance.now();
      const duration = 800;
      const render = (now) => {
        const progress = Math.min((now - startedAt) / duration, 1);
        element.textContent = Math.floor(target * progress).toLocaleString() + suffix;
        if (progress < 1) requestAnimationFrame(render);
      };
      requestAnimationFrame(render);
    }

    function createCell(className, value) {
      const cell = document.createElement('td');
      cell.className = className;
      cell.textContent = value;
      return cell;
    }

    async function loadPortfolio() {
      try {
        const response = await fetch('content.json');
        if (!response.ok) throw new Error('content.json을 불러올 수 없습니다.');
        const { portfolio } = await response.json();
        const experiences = Array.isArray(portfolio.experiences) ? portfolio.experiences : [];
        const list = document.getElementById('experience-list');

        experiences.forEach((experience) => {
          const row = document.createElement('tr');
          row.append(
            createCell('col-server', experience.server || ''),
            createCell(`col-category ${experience.categoryStyle || ''}`, experience.category || ''),
            createCell('col-period', experience.period || ''),
            createCell('col-scale', `${Number(experience.memberCount || 0).toLocaleString()}+`)
          );
          list.appendChild(row);
        });

        const exactTotal = experiences.reduce((total, item) => total + Math.max(0, Number(item.memberCount) || 0), 0);
        // 합계는 경력 상세의 memberCount로 계산하고, 마지막 세 자리는 000으로 고정합니다.
        const roundedTotal = Math.floor(exactTotal / 1000) * 1000;
        animateNumber(document.getElementById('server-count'), experiences.length);
        animateNumber(document.getElementById('member-count'), roundedTotal, '+');
        animateNumber(document.getElementById('experience-years'), Math.max(0, Number(portfolio.experienceYears) || 0));
      } catch (error) {
        console.error(error);
        document.getElementById('experience-list').innerHTML = '<tr><td colspan="4">경력 정보를 불러오지 못했습니다.</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadPortfolio);
</script>
</body>
</html>
